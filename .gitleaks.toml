        '''^drupal11/web/core/modules/shortcut/tests/src/Kernel/ShortcutEntityLinksTest\.php$''',
        '''^drupal11/web/core/modules/system/tests/modules/render_placeholder_message_test/src/RenderPlaceholderMessageTestController\.php$''',
        '''^drupal11/web/core/modules/migrate_drupal/tests/fixtures/drupal6\.php$''',
